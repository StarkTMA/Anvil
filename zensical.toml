[project.theme]
logo = "assets/logo.png"
favicon = "assets/logo.ico"
features = [
  "search.suggest",
  "navigation.tabs",
  "navigation.sections",
  "navigation.footer",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "black"

[project.extra]
homepage = "https://starktma.net"
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/starktma"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/qKsKWbB"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/yasser-benfoughal"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://x.com/@starktma_"

# API reference: docs/api/**/*.md use "::: module" stubs rendered by mkdocstrings.
# Zensical enables autorefs automatically alongside mkdocstrings.
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python.options]
show_symbol_type_toc = true
show_symbol_type_heading = true
show_source = false
show_root_heading = true
inherited_members = true

[project.markdown_extensions]
admonition = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.details = {}
