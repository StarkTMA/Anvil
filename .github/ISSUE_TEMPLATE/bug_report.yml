name: 🐛 Bug Report
description: Anvil writes wrong or outdated JSON, crashes, or the docs are wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reproduce the bug on the latest Anvil release first. Reports without a reproducible snippet will be closed.
  - type: input
    id: anvil_version
    attributes:
      label: Anvil version
      description: Run `pip show mcanvil`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      description: The game version you tested in, and Preview if it was Preview.
      placeholder: 1.26.50
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Entities (actors, animations, controllers, spawn rules)
        - Blocks
        - Items and crafting
        - Biomes and world generation
        - World (dimensions, structures, loot, trades, particles, dialogue)
        - Vibrant Visuals / PBR
        - JSON UI
        - Sounds and textures
        - Kit (wood sets, potions, LDtk)
        - CLI, config and packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest `main.py` that shows the bug. For a docs problem, the page URL and the wrong part.
      render: python
      placeholder: |
        from anvil import ANVIL
        from anvil.api.actors.entity import Entity

        mob = Entity("my_mob")
        mob.queue()
        ANVIL.compile()
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: The JSON you expected, or what should happen.
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: The JSON Anvil wrote, the full traceback, or the in-game Content Log errors.
      render: shell
    validations:
      required: true
  - type: input
    id: reference_link
    attributes:
      label: Reference
      description: The Microsoft Learn page, changelog entry or bedrock-samples file that shows the correct format. Required when Mojang changed a format.
      placeholder: https://learn.microsoft.com/minecraft/creator/
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is an Anvil problem, not an engine limitation or a bug in my own scripts.
          required: true
