name: ✨ Feature Request
description: Something Anvil can't do yet, from a missing Bedrock component to a new API or kit.
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Missing Bedrock component, field or file type
        - New API or workflow
        - New kit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what makes it hard with Anvil today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or JSON
      description: How the Python code should look. For a missing component, a working JSON example the game accepts.
      render: python
      placeholder: |
        entity.server.description.add_int_property("level", (0, 10), default=1)
    validations:
      required: true
  - type: input
    id: reference_link
    attributes:
      label: Reference
      description: Microsoft Learn page, changelog entry or bedrock-samples file. Required for a missing component.
      placeholder: https://learn.microsoft.com/minecraft/creator/
    validations:
      required: false
