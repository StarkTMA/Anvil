name: Test

on:
    workflow_call:

jobs:
    test:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install package and test dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .[test]
            - name: Run tests
              run: python -m pytest tests/
