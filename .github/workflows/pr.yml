name: Pull Request

on:
    pull_request:
        branches:
            - main
            - "release/**"

jobs:
    test:
        uses: ./.github/workflows/test.yml

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.x
            - name: Install package
              run: pip install -e ".[docs]"
            - name: Build the docs without deploying
              run: zensical build --clean

    release-notes:
        if: github.base_ref == 'main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
            - name: Check the version commit that becomes the release notes
              run: |
                  VERSION=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/anvil/__version__.py)
                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
                      echo "v$VERSION is already released, this pull request publishes nothing."
                      exit 0
                  fi

                  # The same commit release.yml reads after the merge.
                  COMMIT=$(git log -1 --format=%H -- src/anvil/__version__.py)
                  SUBJECT=$(git log -1 --format=%s "$COMMIT")
                  git log -1 --format=%b "$COMMIT" | sed -e '/./,$!d' > notes.md
                  echo "Release notes from $COMMIT:"
                  cat notes.md

                  FAILED=0
                  if [ "$SUBJECT" != "$VERSION" ]; then
                      echo "::error::The version commit subject is '$SUBJECT', expected '$VERSION'."
                      FAILED=1
                  fi
                  if [ ! -s notes.md ]; then
                      echo "::error::The version commit has no body, so the release would have no notes."
                      FAILED=1
                  fi
                  if grep -nE '^#+[^# ]' notes.md; then
                      echo "::error::Headings need a space after the #, for example '## Fixes'."
                      FAILED=1
                  fi
                  exit $FAILED
